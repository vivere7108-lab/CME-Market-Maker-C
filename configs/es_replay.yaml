# Replay: the same pipeline over a recorded tape or a generated market.
#
#   harvester replay -c configs/es_replay.yaml                         # generated
#   harvester replay -c configs/es_replay.yaml --control               # ...and the gate-off control
#   harvester fetch  -c configs/es_replay.yaml --start 2026-09-08T13:30 --end 2026-09-08T20:00 -o data_cache/es.dbn.zst
#   harvester replay -c configs/es_replay.yaml --dbn data_cache/es.dbn.zst
#
# Everything the quoter does is the same as in es_paper.yaml; what differs
# is where records come from and where fills come from. The toxicity
# buckets are smaller so the gate warms up inside a short generated tape --
# on a real ES tape use the es_paper.yaml values.

product: ES

databento:
  schema: mbp-10
  symbol: ES.v.0
  stype_in: continuous

toxicity:
  bucket_contracts: 200
  window_buckets: 20
  history_buckets: 400
  warmup_buckets: 40

quoting:
  gamma: 0.05
  kappa: 1.5                  # the depth dial, not a fill-intensity parameter;
                              # see es_paper.yaml. Fitting it to the tape loses
                              # $1,324 a session. Do not.
  horizon_seconds: 60.0
  behind_best_ticks: 1        # a floor; the quote sits a median 3 ticks back
  max_behind_ticks: 8
  base_size: 1
  max_size: 1

execution:
  max_messages_per_second: 30.0
  requote_min_interval_ms: 250.0

risk:
  max_position: 2
  reduce_only_position: 1
  daily_loss_limit_usd: 2000.0

replay:
  source: synthetic
  synthetic_seconds: 1800.0
  synthetic_start_price: 5000.0
  synthetic_seed: 7
  synthetic_toxic_fraction: 0.2   # share of the tape in informed sweeps. 0 is
                                  # pure noise; the generated market is a
                                  # harness, not a model of ES.
  queue_position: back            # `front` is the optimistic bound
  out_dir: runs/replay
